# Local GitLab CE for demo + E2E. arm64-native on Apple Silicon.
#
# Runs in its own Colima VM (README "VM memory"). First boot is a few minutes. Keep it warm — never `compose down` on talk day.
services:
  gitlab:
    # Pinned: the data volume belongs to this version, and `latest` would upgrade it unasked.
    image: gitlab/gitlab-ce:19.5.3-ce.0
    container_name: e2e-gitlab
    hostname: gitlab.test
    restart: unless-stopped
    shm_size: 256m
    ports:
      - "80:80"
    environment:
      # GitLab 19 runs a strength check that rejects dictionary-ish passwords
      # ("must not contain commonly used combinations of words and letters") and the
      # seed silently fails to create root. Keep these opaque.
      GITLAB_ROOT_PASSWORD: Rk8xQ2-mT9zV4-pB6nL1
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.test'

        # -- trim boot time and RAM: none of this is needed for the fixture --
        # Keep this list conservative. Omnibus *rejects unknown keys and crash-loops*
        # reconfigure: `grafana`, `mattermost` and `gitlab_ci` were all removed in
        # 16.x/17.x and each one is a hard boot failure, not a warning.
        # prometheus_monitoring=false already covers every exporter.
        registry['enable'] = false
        registry['nginx']['enable'] = false
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        gitlab_pages['enable'] = false

        # -- memory discipline; see README "VM memory" --
        # A 6 GB Rancher VM shared with k3s died twice under fixture load at the
        # defaults (the VM is 12 GB now). Single-process puma is the big win (each worker is ~400-600 MB) and
        # a one-user demo instance has no use for more.
        # ONE worker, not zero. worker_processes = 0 is single mode: GitLab warns
        # "some features may not work", there is no worker supervision, and an observed
        # consequence was puma silently ceasing to listen after ~15 h while runit still
        # reported it as running — a 502 that nothing recovers from. One cluster worker
        # keeps nearly all the memory saving AND the memory-killer/auto-restart.
        puma['worker_processes'] = 1
        # Past this the worker is replaced. At 1024 it was replaced every ~6 minutes under
        # a run of scenarios; a replacement is a fork, cheap, but each one starts cold.
        puma['per_worker_max_memory_mb'] = 2048
        # `concurrency`, not `max_concurrency`: GitLab 17+ ignores the old key without a
        # word, and ran 20 job threads (and as many database connections) instead of 5.
        sidekiq['concurrency'] = 5
        postgresql['shared_buffers'] = "128MB"
        postgresql['max_connections'] = 100
        gitaly['configuration'] = {
          concurrency: [
            { rpc: "/gitaly.SmartHTTPService/PostReceivePack", max_per_repo: 2 },
          ],
        }
        # Glibc arena bloat is a known Ruby memory sink; capping it saves real RSS.
        gitlab_rails['env'] = { 'MALLOC_ARENA_MAX' => '2' }
        gitaly['env'] = { 'MALLOC_ARENA_MAX' => '2' }

        # Signup off: every account is created by bootstrap.py
        gitlab_rails['gitlab_signup_enabled'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      # NOT /-/readiness: that endpoint is IP-allowlisted to 127.0.0.1, so anything
      # arriving via the docker gateway gets a 404 and looks unhealthy forever.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/users/sign_in"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
